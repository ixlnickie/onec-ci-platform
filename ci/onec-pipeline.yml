# Центральный переиспользуемый pipeline для репозиториев конфигураций 1С (формат EDT).
#
# Подключается в проекте одной строкой (см. templates/edt-configuration/.gitlab-ci.yml):
#   include:
#     - project: 'onec-platform/ci-templates'
#       ref: main
#       file: '/onec-pipeline.yml'
#
# Стадии lint/sonar работают на docker-раннере без платформы 1С.
# Стадии build/test/artifact/deploy-* требуют раннер с тегом `onec` и платформу 1С
# и включаются переменной ONEC_ENABLED=true.
#
# Переменные уровня группы onec-platform (наследуются всеми проектами):
#   SONAR_HOST_URL    адрес SonarQube для раннера, например http://sonarqube:9000
#   SONAR_TOKEN       токен SonarQube (masked)
#   ONEC_ENABLED      true, когда на раннере `onec` есть платформа 1С
#   ONEC_CONFIG_PATH  путь к исходникам EDT (по умолчанию src)

stages:
  - lint
  - build
  - test
  - artifact
  - deploy-test
  - deploy-prod

variables:
  APP_NAME: onec-config
  ONEC_CONFIG_PATH: src
  SONAR_SCANNER_IMAGE: sonarsource/sonar-scanner-cli:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# ---------------------------------------------------------------------------
# Стадии без платформы 1С (docker-runner)
# ---------------------------------------------------------------------------

lint:
  stage: lint
  tags: [docker]
  image:
    name: $SONAR_SCANNER_IMAGE
    entrypoint: [""]
  interruptible: true
  script:
    - test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL не задан"; exit 1; }
    - test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN не задан"; exit 1; }
    # Sonar не допускает '/' в ключе: onec-platform/demo -> onec-platform:demo
    - SONAR_KEY="${SONAR_PROJECT_KEY:-$CI_PROJECT_PATH}"; SONAR_KEY="${SONAR_KEY//\//:}"
    - >-
      sonar-scanner
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_KEY"
      -Dsonar.projectName="${CI_PROJECT_TITLE:-$CI_PROJECT_NAME}"
      -Dsonar.projectVersion="$CI_COMMIT_SHORT_SHA"
      -Dsonar.sources="${ONEC_CONFIG_PATH:-src}"
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.scm.provider=git
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# Стадии с платформой 1С (раннер с тегом onec)
# ---------------------------------------------------------------------------

.onec:
  tags: [onec]
  before_script:
    - export APP_VERSION="${CI_COMMIT_TAG:-0.0.0-${CI_COMMIT_SHORT_SHA}}"
  rules:
    - if: $ONEC_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: never

build:
  extends: .onec
  stage: build
  script:
    - bash ci/scripts/build.sh
  artifacts:
    paths:
      - build/*.cf
      - build/*.cfe
    expire_in: 1 week

test:
  extends: .onec
  stage: test
  needs: [build]
  script:
    - bash ci/scripts/test.sh
  artifacts:
    when: always
    paths:
      - build/junit.xml
    reports:
      junit: build/junit.xml
    expire_in: 1 week

artifact:
  extends: .onec
  stage: artifact
  needs: [build, test]
  script:
    - echo "Артефакт версии $APP_VERSION"
  artifacts:
    name: "$APP_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/*.cf
      - build/*.cfe
    expire_in: never
  rules:
    - if: $ONEC_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: never

deploy-test:
  extends: .onec
  stage: deploy-test
  needs: [artifact]
  script:
    - bash ci/scripts/deploy-test.sh
  environment:
    name: test
  resource_group: test
  rules:
    - if: $ONEC_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - when: never

deploy-prod:
  extends: .onec
  stage: deploy-prod
  needs: [artifact]
  script:
    - bash ci/scripts/deploy-prod.sh
  environment:
    name: production
  resource_group: production
  allow_failure: false
  rules:
    - if: $ONEC_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
    - when: never
